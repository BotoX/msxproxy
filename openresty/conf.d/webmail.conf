# msxproxy

lua_shared_dict auth_cache 100m;
lua_shared_dict auth_failures 5m;
lua_shared_dict sessions 100m;
lua_shared_dict locks 1m;
lua_shared_dict metrics 1m;

map $uri $is_AutoDiscover {
    ~*^/autodiscover/autodiscover.xml "xml";
    ~*^/autodiscover/autodiscover.json "json";
    ~*^/autodiscover/autodiscover.svc "svc";
}

geo $is_trustedNetwork {
    143.50.0.0/16 1;
    10.0.0.0/8 1;
    143.50.129.85/32 "";
}

geo $is_testIP {
}

geo $modify_addmapi {
}

geo $bearer_local {
}


upstream exchange_upstream {
    ip_hash;
    ntlm;

    server ex19ms01.uni-graz.at:443;
    server ex19ms02.uni-graz.at:443;
    server ex19ms03.uni-graz.at:443;
    server ex19ms04.uni-graz.at:443;
}

upstream owa_upstream {
    ntlm;

    server ex19ms04.uni-graz.at:443;
}

upstream mitm_upstream {
    ntlm;

    server 127.0.0.1:8080;
}

init_worker_by_lua_block {
    local hc = require("resty.upstream.healthcheck")

    local ok, err = hc.spawn_checker{
        shm = "healthcheck",
        upstream = "exchange_upstream",
        type = "https",

        http_req = "GET /mapi/healthcheck.htm HTTP/1.0\r\nHost: email.uni-graz.at\r\n\r\n",

        interval = 2000,
        timeout = 1000,
        fall = 3,
        rise = 2,
        valid_statuses = {200},
        concurrency = 10,
        ssl_verify = true,
        host = "email.uni-graz.at"
    }
    if not ok then
        ngx.log(ngx.ERR, "failed to spawn health checker: ", err)
        return
    end
}


server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/msxproxy/ssl/webmail-ec-384.pem;
    ssl_certificate_key /etc/msxproxy/ssl/webmail-ec-384.key;
    ssl_certificate /etc/msxproxy/ssl/webmail-rsa-3072.pem;
    ssl_certificate_key /etc/msxproxy/ssl/webmail-rsa-3072.key;
    server_name webmail.uni-graz.at;

    keepalive_timeout 3h;
    proxy_read_timeout 3h;
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Upstream $upstream_addr always;

    proxy_http_version 1.1;
    proxy_set_header Host $Host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_ssl_name email.uni-graz.at;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_protocols TLSv1.2;

    set $is_RPC "";
    set $ModernAuth "";

    location = / {
        return 302 /owa/;
    }

    location = /favicon.ico {
        empty_gif;
        access_log off;
    }

    location = /ActiveSync_Enroll_Complete {
        default_type "text/html; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        alias /opt/msxproxy/openresty/html/activesync_enroll_complete.html;
    }

    location / {
        access_by_lua_file /opt/msxproxy/openresty/lua/msxauth.lua;

        proxy_pass https://exchange_upstream;
    }

    # Internal-only target for unenrolled ActiveSync DeviceID enrollment (activesync-enroll).
    # Only reached via ngx.exec("@activesync_enroll") when activesync_enroll.enabled = true.
    location @activesync_enroll {
        internal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~* ^/(mapi|rpc|owa|oab|ecp|ews|Microsoft-Server-ActiveSync)/healthcheck.htm$ {
        more_clear_input_headers "Authorization";
        proxy_pass https://exchange_upstream;
    }

    location /rpc/rpcproxy.dll {
        set $is_RPC 1;
        access_by_lua_file /opt/msxproxy/openresty/lua/msxauth.lua;

        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass https://exchange_upstream;
    }

    location /OWA {
        return 302 /owa;
    }
    location ~* ^/owa/auth {
        return 403;
    }
    # Close the client keepalive connection on logout so the pinned owa_upstream
    # socket is torn down immediately (keepalive_timeout 0 forces Connection: close).
    location = /owa/logout {
        keepalive_timeout 0;
        access_by_lua_file /opt/msxproxy/openresty/lua/owaauth.lua;
    }
    location ~* ^/(owa|ows|ecp)($|/) {
        access_by_lua_file /opt/msxproxy/openresty/lua/owaauth.lua;

        proxy_pass https://owa_upstream;
    }

    location = /status {
        access_log off;
        allow 143.50.129.85/32;
        allow 143.50.128.0/24;
        allow 143.50.20.128/25;
        allow 143.50.50.0/24;
        allow 127.0.0.1;
        deny all;

        default_type text/plain;
        content_by_lua_block {
            local hc = require("resty.upstream.healthcheck")
            ngx.say("Nginx Worker PID: ", ngx.worker.pid())
            ngx.print(hc.status_page())
        }
    }

    location = /metrics {
        access_log off;
        allow 143.50.129.85/32;
        allow 143.50.128.0/24;
        allow 143.50.20.128/25;
        allow 143.50.50.0/24;
        allow 127.0.0.1;
        deny all;

        default_type "text/plain; version=0.0.4; charset=utf-8";
        content_by_lua_block {
            local metrics = require("metrics")
            ngx.print(metrics.render())
        }
    }

    location = /metrics/mailproxy {
        access_log off;
        allow 143.50.129.85/32;
        allow 143.50.128.0/24;
        allow 143.50.20.128/25;
        allow 143.50.50.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:9101/metrics;
    }
}

server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/msxproxy/ssl/autoconfig.pem;
    ssl_certificate_key /etc/msxproxy/ssl/autoconfig.key;
    server_name autoconfig.uni-graz.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/msxproxy/openresty/www/autoconfig;
}

server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/msxproxy/ssl/autodiscover-ec-384.pem;
    ssl_certificate_key /etc/msxproxy/ssl/autodiscover-ec-384.key;
    ssl_certificate /etc/msxproxy/ssl/autodiscover-rsa-3072.pem;
    ssl_certificate_key /etc/msxproxy/ssl/autodiscover-rsa-3072.key;
    server_name autodiscover.uni-graz.at autodiscover.edu.uni-graz.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Upstream $upstream_addr always;

    proxy_http_version 1.1;
    proxy_set_header Host $Host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_ssl_name email.uni-graz.at;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_protocols TLSv1.2;

    set $is_RPC "";
    set $ModernAuth "";

    location = /favicon.ico {
        empty_gif;
        access_log off;
    }

    location = / {
        default_type 'text/html';
        content_by_lua_block {
            local string_format = string.format
            local html_template = [[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>%s</title>
    <style>
        body, html {
            height: 100%%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Test Group: %s</h1>
    <h2>Add MAPI: %s</h2>
    <h3>Your IP Address: %s</h3>
</body>
</html>]]

            local is_testIP = ((ngx.var.is_testIP or "") == "1")
            local modify_addmapi = ((ngx.var.modify_addmapi or "") == "1")

            ngx.print(
                string_format(html_template, ngx.var.host, is_testIP, modify_addmapi, ngx.var.remote_addr)
            )
            return ngx.exit(ngx.HTTP_OK)
        }
    }

    location /.well-known/microsoft-identity-association.json {
        more_clear_input_headers "Authorization";
        proxy_pass https://exchange_upstream;
    }
    location /autodiscover/metadata/json/1 {
        more_clear_input_headers "Authorization";
        proxy_pass https://exchange_upstream;
    }

    location ~* ^/autodiscover/autodiscover\.(xml|json|svc) {
        access_by_lua_file /opt/msxproxy/openresty/lua/msxauth.lua;

        proxy_pass https://exchange_upstream;

        more_clear_input_headers "Accept-Encoding";

        header_filter_by_lua_block {
            local ngx = ngx
            if ngx.var.is_AutoDiscover == "xml" and ngx.status == 200 then
                if ngx.var.is_testIP == "1" or ngx.var.ModernAuth == "1" then
                    ngx.header.content_length = nil
                end
            end
        }

        body_filter_by_lua_block {
            local ngx = ngx
            local table_insert  = table.insert
            local table_concat  = table.concat
            local string_gsub   = string.gsub
            local string_find   = string.find
            local string_format = string.format
            local string_match  = string.match

            -- Guard: Only run if our map/logic flagged this request for modification
            if not (ngx.var.is_AutoDiscover == "xml" and ngx.status == 200) then
                return
            end
            if not (ngx.var.is_testIP == "1" or ngx.var.ModernAuth == "1") then
                return
            end

            -- Guard: Don't modify if it's not XML (extra safety)
            if not string_find(ngx.header.content_type or "", "xml") then
                return
            end

            local chunk, eof = ngx.arg[1], ngx.arg[2]
            local ctx = ngx.ctx
            ctx.chunks = ctx.chunks or {}

            if chunk and chunk ~= "" then
                table_insert(ctx.chunks, chunk)
                ngx.arg[1] = nil
            end

            if eof then
                local body = table_concat(ctx.chunks)

                body = string_gsub(body, "email%.uni%-graz%.at", "webmail.uni-graz.at")
                body = string_gsub(body, "ex19ms0[0-9]%.pers%.ad%.uni%-graz%.at", "webmail.uni-graz.at")

                local owa_block = [[<Internal>
          <OWAUrl AuthenticationMethod="Fba">https://webmail.uni-graz.at/owa/</OWAUrl>
          <Protocol>
            <Type>EXCH</Type>
            <ASUrl>https://webmail.uni-graz.at/EWS/Exchange.asmx</ASUrl>
          </Protocol>
        </Internal>]]
                body = string_gsub(body, "<Internal>.-</Internal>", owa_block)

                if ngx.var.modify_addmapi == "1" then
                    local mailbox_id = string_match(body, "<Server>(.-@.-uni%-graz%.at)</Server>")
                    local mapi_template = [[<Protocol Type="mapiHttp" Version="1">
        <MailStore>
          <InternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</InternalUrl>
          <ExternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</ExternalUrl>
        </MailStore>
        <AddressBook>
          <InternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</InternalUrl>
          <ExternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</ExternalUrl>
        </AddressBook>
      </Protocol>]]
                    local mapi_block = string_format(mapi_template, mailbox_id, mailbox_id, mailbox_id, mailbox_id)
                    body = string_gsub(body, "<PublicFolderInformation>", mapi_block .. "\n      <PublicFolderInformation>")
                end

                ngx.arg[1] = body
                ngx.arg[2] = true
            else
                ngx.arg[1] = nil
                ngx.arg[2] = false
            end
        }
    }
}
