# msxproxy

lua_shared_dict auth_cache 100m;
lua_shared_dict auth_failures 5m;
lua_shared_dict sessions 100m;
lua_shared_dict locks 1m;

map $uri $is_ActiveSync {
    ~*^/Microsoft-Server-ActiveSync 1;
}

map $uri $is_AutoDiscover {
    ~*^/autodiscover/autodiscover.xml "xml";
    ~*^/autodiscover/autodiscover.json "json";
    ~*^/autodiscover/autodiscover.svc "svc";
}

geo $is_trustedNetwork {
    143.50.0.0/16 1;
    10.0.0.0/8 1;
}

geo $is_testIP {
}

geo $modify_addmapi {
}

geo $bearer_local {
}


upstream exchange_upstream {
    ip_hash;
    ntlm;

    server ex19ms01.uni-graz.at:443;
    server ex19ms02.uni-graz.at:443;
    server ex19ms03.uni-graz.at:443;
    server ex19ms04.uni-graz.at:443;
}

upstream owa_upstream {
    ntlm;

    server ex19ms04.uni-graz.at:443;
}

upstream mitm_upstream {
    ntlm;

    server 127.0.0.1:8080;
}

init_worker_by_lua_block {
    local hc = require("resty.upstream.healthcheck")

    local ok, err = hc.spawn_checker{
        shm = "healthcheck",
        upstream = "exchange_upstream",
        type = "https",

        http_req = "GET /mapi/healthcheck.htm HTTP/1.0\r\nHost: email.uni-graz.at\r\n\r\n",

        interval = 2000,
        timeout = 1000,
        fall = 3,
        rise = 2,
        valid_statuses = {200},
        concurrency = 10,
        ssl_verify = true,
        host = "email.uni-graz.at"
    }
    if not ok then
        ngx.log(ngx.ERR, "failed to spawn health checker: ", err)
        return
    end
}


server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/ssl/private/webmail.pem;
    ssl_certificate_key /etc/ssl/private/webmail.key;
    server_name webmail.uni-graz.at;

    keepalive_timeout 3h;
    proxy_read_timeout 3h;
    client_max_body_size 100m;
    client_body_buffer_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Upstream $upstream_addr always;

    proxy_http_version 1.1;
    proxy_set_header Host $Host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_ssl_name email.uni-graz.at;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    set $is_RPC "";

    location = / {
        return 302 /owa/;
    }

    location = /favicon.ico {
        empty_gif;
        access_log off;
    }

    location / {
        access_by_lua_file conf/lua/msxauth.lua;

        proxy_pass https://exchange_upstream;
    }

    location ~* ^/(mapi|rpc|owa|oab|ecp|ews|Microsoft-Server-ActiveSync)/healthcheck.htm$ {
        proxy_pass https://exchange_upstream;
    }

    location /rpc/rpcproxy.dll {
        set $is_RPC 1;
        access_by_lua_file conf/lua/msxauth.lua;

        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass https://exchange_upstream;
    }

    location = /ActiveSync_Enroll_Complete {
        default_type text/html;
        return 200 "<h1>ActiveSync Device Trust Enroll Complete!</h1><h2>Return to your mail client and refresh / sync your emails.</h2>";
    }

    location /OWA {
        return 302 /owa;
    }
    location ~* ^/owa/auth {
        return 403;
    }
    location ~* ^/(owa|ows|ecp)($|/) {
        access_by_lua_block {
            local is_pinned = ((ngx.var.ntlm_pinned or "") ~= "")
            local resty_openidc = require("resty.openidc")
            local resty_jwt = require("resty.jwt")
            local s4u2api = require("s4u2api")
            local opts = {
                redirect_uri = "/owa/redirect_uri",
                logout_path = "/owa/logout",
                discovery = "https://login.uni-graz.at/auth/realms/UniGraz/.well-known/openid-configuration",
                client_id = "https_webmail.uni-graz.at",
                client_secret = "***",
                scope = "openid ActiveDirectoryPrincipal",
                use_pkce = true,
                accept_unsupported_alg = false,
                introspection_enable_negative_cache = true,
                cache_segment = "webmail:owa",
                session_contents = {
                    access_token = true
                }
            }
            local session_opts = {
                secret = "***",
                -- With storage key hashed it is impossible to decrypt data on server side without having a cookie too
                hash_storage_key = true,
                cookie_http_only = true,
                cookie_secure = true,
                cookie_same_site = "Lax",
                remember = false,
                storage = "shm",
                prefix = "owa",
                zone = "sessions"
            }
            local res, err, _, session = resty_openidc.authenticate(opts, nil, nil, session_opts)

            if err then
                ngx.status = 500
                ngx.header.content_type = 'text/plain'
                ngx.say(err)
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            local jwt_obj = resty_jwt:load_jwt(res.access_token)
            local claims = jwt_obj.payload
            local upn = claims.krb5_principal

            if not upn then
                ngx.status = 500
                ngx.header.content_type = 'text/plain'
                ngx.say("Internal Server Error.\nkrb5_principal not found in claims.")
                return ngx.exit(500)
            end

            if is_pinned then
                ngx.req.set_header("Authorization", "")
            else
                s4u2api.impersonate(upn, res.access_token)
            end
        }

        proxy_pass https://owa_upstream;
    }

    location = /status {
        access_log off;
        allow 143.50.128.0/24;
        allow 143.50.20.128/25;
        allow 143.50.50.0/24;
        allow 127.0.0.1;
        deny all;

        default_type text/plain;
        content_by_lua_block {
            local hc = require("resty.upstream.healthcheck")
            ngx.say("Nginx Worker PID: ", ngx.worker.pid())
            ngx.print(hc.status_page())
        }
    }
}

server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/ssl/private/autoconfig.pem;
    ssl_certificate_key /etc/ssl/private/autoconfig.key;
    server_name autoconfig.uni-graz.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/autoconfig;
}

server {
    listen 443 ssl;
    http2 off;
    ssl_certificate /etc/ssl/private/autodiscover.pem;
    ssl_certificate_key /etc/ssl/private/autodiscover.key;
    server_name autodiscover.uni-graz.at autodiscover.edu.uni-graz.at;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Upstream $upstream_addr always;

    proxy_http_version 1.1;
    proxy_set_header Host $Host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_ssl_name email.uni-graz.at;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    set $is_RPC "";

    location = /favicon.ico {
        empty_gif;
        access_log off;
    }

    location = /bunny.webp {
        root /var/www/html;
    }

    location = / {
        default_type 'text/html';
        root /var/www/html;
        content_by_lua_block {
            local string_format = string.format
            local html_template = [[<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>%s</title>
    <style>
        body, html {
            height: 100%%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }
        img {
            max-width: 100%%;
            max-height: 100%%;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Test Group: %s</h1>
    <h2>Add MAPI: %s</h2>
    <img src="/bunny.webp" alt="Osterhase">
    <h3>Your IP Address: %s</h3>
</body>
</html>]]

            local is_testIP = ((ngx.var.is_testIP or "") == "1")
            local modify_addmapi = ((ngx.var.modify_addmapi or "") == "1")

            ngx.print(
                string_format(html_template, ngx.var.host, is_testIP, modify_addmapi, ngx.var.remote_addr)
            )
            return ngx.exit(ngx.HTTP_OK)
        }
    }

    location /.well-known/microsoft-identity-association.json {
        proxy_pass https://exchange_upstream;
    }
    location /autodiscover/metadata/json/1 {
        proxy_pass https://exchange_upstream;
    }

    location ~* ^/autodiscover/autodiscover\.(xml|json|svc) {
        set $ModernAuth "";
        access_by_lua_file conf/lua/msxauth.lua;

        proxy_pass https://exchange_upstream;

        more_clear_input_headers "Accept-Encoding";

        header_filter_by_lua_block {
            local ngx = ngx
            if ngx.var.is_AutoDiscover == "xml" and ngx.status == 200 then
                if ngx.var.is_testIP == "1" or ngx.var.ModernAuth == "1" then
                    ngx.header.content_length = nil
                end
            end
        }

        body_filter_by_lua_block {
            local ngx = ngx
            local table_insert  = table.insert
            local table_concat  = table.concat
            local string_gsub   = string.gsub
            local string_find   = string.find
            local string_format = string.format
            local string_match  = string.match

            -- Guard: Only run if our map/logic flagged this request for modification
            if not (ngx.var.is_AutoDiscover == "xml" and ngx.status == 200) then
                return
            end
            if not (ngx.var.is_testIP == "1" or ngx.var.ModernAuth == "1") then
                return
            end

            -- Guard: Don't modify if it's not XML (extra safety)
            if not string_find(ngx.header.content_type or "", "xml") then
                return
            end

            local chunk, eof = ngx.arg[1], ngx.arg[2]
            local ctx = ngx.ctx
            ctx.chunks = ctx.chunks or {}

            if chunk and chunk ~= "" then
                table_insert(ctx.chunks, chunk)
                ngx.arg[1] = nil
            end

            if eof then
                local body = table_concat(ctx.chunks)

                body = string_gsub(body, "email%.uni%-graz%.at", "webmail.uni-graz.at")
                body = string_gsub(body, "ex19ms0[0-9]%.pers%.ad%.uni%-graz%.at", "webmail.uni-graz.at")

                local owa_block = [[<Internal>
          <OWAUrl AuthenticationMethod="Fba">https://webmail.uni-graz.at/owa/</OWAUrl>
          <Protocol>
            <Type>EXCH</Type>
            <ASUrl>https://webmail.uni-graz.at/EWS/Exchange.asmx</ASUrl>
          </Protocol>
        </Internal>]]
                body = string_gsub(body, "<Internal>.-</Internal>", owa_block)

                if ngx.var.modify_addmapi == "1" then
                    local mailbox_id = string_match(body, "<Server>(.-@.-uni%-graz%.at)</Server>")
                    local mapi_template = [[<Protocol Type="mapiHttp" Version="1">
        <MailStore>
          <InternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</InternalUrl>
          <ExternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</ExternalUrl>
        </MailStore>
        <AddressBook>
          <InternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</InternalUrl>
          <ExternalUrl>https://webmail.uni-graz.at/mapi/emsmdb/?MailboxId=%s</ExternalUrl>
        </AddressBook>
      </Protocol>]]
                    local mapi_block = string_format(mapi_template, mailbox_id, mailbox_id, mailbox_id, mailbox_id)
                    body = string_gsub(body, "<PublicFolderInformation>", mapi_block .. "\n      <PublicFolderInformation>")
                end

                ngx.arg[1] = body
                ngx.arg[2] = true
            else
                ngx.arg[1] = nil
                ngx.arg[2] = false
            end
        }
    }
}
