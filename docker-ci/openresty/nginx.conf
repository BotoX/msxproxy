load_module /usr/local/openresty/modules/ngx_http_upstream_ntlm_module.so;

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    keepalive_timeout 65;

    # Docker embedded DNS resolver for Lua cosockets (resty.http / resty.openidc / healthcheck)
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Include the real production msxproxy-http.conf verbatim
    include /opt/msxproxy/deploy/openresty/msxproxy-http.conf;
}
