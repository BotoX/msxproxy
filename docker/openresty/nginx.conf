load_module /usr/local/openresty/modules/ngx_http_upstream_ntlm_module.so;

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;
    log_not_found off;

    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    server_tokens           off;
    server_name_in_redirect off;
    ignore_invalid_headers  on;
    recursive_error_pages   on;
    types_hash_max_size     4096;

    # Exchange / proxy defaults (per-vhost/location overrides live in openresty/conf.d/webmail.conf)
    keepalive_timeout       65;
    client_max_body_size    1m;
    client_body_buffer_size 1m;
    proxy_buffers           8 16k;
    proxy_buffer_size       32k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout      3h;

    # Mozilla Intermediate TLS configuration (OpenSSL 3.5+ with post-quantum X25519MLKEM768)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ecdh_curve            X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets       off;

    # Compression
    gzip              on;
    gzip_http_version 1.1;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        application/atom+xml
                      application/javascript
                      application/json
                      application/vnd.ms-fontobject
                      application/x-font-ttf
                      application/x-web-app-manifest+json
                      application/x-httpd-php
                      application/xhtml+xml
                      application/xml
                      application/xml+rss
                      font/opentype
                      image/svg+xml
                      image/x-icon
                      text/css
                      text/plain
                      text/xml;
    gzip_buffers      16 8k;
    gzip_disable      "MSIE [1-6]\.(?!.*SV1)";

    # Auto-generated from host /etc/resolv.conf (or OPENRESTY_RESOLVER) at startup
    include /tmp/resolver.conf;

    # Include the repo msxproxy-http.conf verbatim
    include /opt/msxproxy/deploy/openresty/msxproxy-http.conf;
}
