# Include this inside the http {} block of /usr/local/openresty/nginx/conf/nginx.conf:
#
#   include /opt/msxproxy/deploy/openresty/msxproxy-http.conf;
#
# Also load the NTLM module at the top level of nginx.conf:
#
#   load_module /usr/local/openresty/modules/ngx_http_upstream_ntlm_module.so;

proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 3;

# lua-resty-upstream-healthcheck
lua_shared_dict healthcheck 1m;
lua_socket_log_errors off;

# lua-resty-openidc caches
lua_shared_dict discovery 1m;
lua_shared_dict jwks 1m;
lua_shared_dict jwt_verification 100m;
lua_shared_dict introspection 100m;

# /etc/msxproxy/config.lua is loaded before repo Lua modules
lua_package_path "/etc/msxproxy/?.lua;/opt/msxproxy/openresty/lua/?.lua;;";

include /opt/msxproxy/openresty/conf.d/*.conf;
