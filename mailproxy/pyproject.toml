[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailproxy"
version = "0.1.0"
description = "IMAP/SMTP proxy with OAuth2->Kerberos bridging"
authors = [
    { name = "BotoX", email = "github@botox.bz" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uvloop",
    "gssapi",
    "pyjwt[crypto]",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "black",
    "isort",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "7.0"
addopts = "-ra"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]
