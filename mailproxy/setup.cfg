[metadata]
name = mailproxy
version = 0.1.0
description = IMAP/SMTP proxy with OAuth2->Kerberos bridging
author = BotoX
platforms = any

[options]
packages = find:
python_requires = >=3.10
install_requires =
    uvloop
    gssapi
    pyjwt[crypto]
    httpx

[options.packages.find]
where = .

[tool:pytest]
addopts = -ra
testpaths = tests
asyncio_mode = auto
